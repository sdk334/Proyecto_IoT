# Mosquitto Broker - Hidroponía IoT

listener 1883
listener 9001
protocol websockets

# Permitir conexiones anónimas (solo para desarrollo)
allow_anonymous true

# Persistencia de mensajes
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Retención máxima de mensajes QoS 1 y 2
max_queued_messages 1000

# Tópicos del proyecto - sin restricciones en modo desarrollo
# escom/iot/hidroponia/sensores/temperatura  QoS 0
# escom/iot/hidroponia/sensores/humedad      QoS 0
# escom/iot/hidroponia/sensores/nivel_agua   QoS 1
# escom/iot/hidroponia/actuadores/bomba      QoS 2
